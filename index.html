<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Asistencia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { max-width: 440px; width: 100%; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 20px; font-size: 24px; }
        label { display: block; margin-bottom: 6px; color: #4a4a4a; font-size: 14px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; margin-bottom: 18px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; background-color: #f8fafc; transition: border-color 0.2s; }
        input:focus, select:focus { outline: none; border-color: #1a73e8; background-color: #fff; }
        .video-container { width: 100%; height: 240px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        button { width: 100%; padding: 14px; background-color: #1a73e8; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #9aa0a6; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; color: #5f6368; line-height: 1.4; }
        .success { color: #137333 !important; font-weight: bold; }
        .error { color: #c5221f !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control de Asistencia</h2>
    
    <label for="nombre">Nombre Completo del Empleado</label>
    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
    
    <label for="tipo">Tipo de Registro</label>
    <select id="tipo">
        <option value="Entrada">Entrada</option>
        <option value="Salida">Salida</option>
    </select>

    <div class="video-container">
        <video id="camara" autoplay playsinline></video>
        <canvas id="lienzo" style="display:none;"></canvas>
    </div>

    <button id="btnRegistrar" onclick="registrarAsistencia()" disabled>Cargando GPS y Cámara...</button>
    <p id="status">Solicitando permisos de hardware...</p>
</div>

<script>
    // URL de producción generada en tu Google Apps Script
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyNptRR05NxIPqzNok5IJPHq6Ii57vG8tZbWEFvCQ2Uli60dbHNV-_1VB_6wz8_euzm2g/exec";

    const camara = document.getElementById('camara');
    const lienzo = document.getElementById('lienzo');
    const btnRegistrar = document.getElementById('btnRegistrar');
    const status = document.getElementById('status');
    const contexto = lienzo.getContext('2d');
    
    let latitudActual = null;
    let longitudActual = null;
    let camaraLista = false;
    let gpsListo = false;

    // Verificar estado de preparación del dispositivo
    function verificarReady() {
        if (camaraLista && gpsListo) {
            btnRegistrar.disabled = false;
            btnRegistrar.innerText = "Registrar Asistencia";
            status.innerText = "Dispositivo listo para registrar.";
            status.className = "";
        }
    }

    // 1. Inicializar Cámara (Frontal preferentemente en móviles)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => { 
            camara.srcObject = stream; 
            camaraLista = true;
            verificarReady();
        })
        .catch(err => { 
            status.innerText = "Error crítico: Activa los permisos de la cámara."; 
            status.className = "error";
        });

    // 2. Inicializar Ubicación en tiempo real con alta precisión
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            posicion => {
                latitudActual = posicion.coords.latitude;
                longitudActual = posicion.coords.longitude;
                gpsListo = true;
                verificarReady();
            },
            error => { 
                status.innerText = "Error crítico: Activa la ubicación (GPS) de tu dispositivo."; 
                status.className = "error";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        status.innerText = "Tu navegador no soporta geolocalización.";
        status.className = "error";
    }

    // 3. Envío de Datos a Producción
    function registrarAsistencia() {
        const nombre = document.getElementById('nombre').value.trim();
        const tipo = document.getElementById('tipo').value;

        if (!nombre) {
            alert("Por favor, ingresa tu nombre completo.");
            return;
        }

        // Bloquear interfaz para evitar peticiones concurrentes
        btnRegistrar.disabled = true;
        btnRegistrar.innerText = "Guardando en el servidor...";
        status.innerText = "Capturando foto y procesando coordenadas...";

        // Forzar dimensiones nativas del feed de video al canvas
        lienzo.width = camara.videoWidth;
        lienzo.height = camara.videoHeight;
        contexto.drawImage(camara, 0, 0, lienzo.width, lienzo.height);
        const fotoBase64 = lienzo.toDataURL('image/jpeg', 0.8); // Compresión al 80% para ahorrar cuota de red

        const payload = {
            empleado: nombre,
            movimiento: tipo,
            latitud: latitudActual,
            longitud: longitudActual,
            foto: fotoBase64
        };

        // Envío de datos como text/plain evita que el navegador envíe una solicitud OPTIONS (Preflight)
        // la cual no es soportada de manera nativa por las Web Apps de Google Apps Script.
        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === "success") {
                status.innerText = "✅ " + res.message;
                status.className = "success";
                document.getElementById('nombre').value = ""; // Limpiar campo
            } else {
                status.innerText = "❌ Error en servidor: " + res.message;
                status.className = "error";
            }
        })
        .catch(err => {
            status.innerText = "❌ Error de conexión. Inténtalo de nuevo.";
            status.className = "error";
        })
        .finally(() => {
            // Reestablecer el botón tras la respuesta
            btnRegistrar.disabled = false;
            btnRegistrar.innerText = "Registrar Asistencia";
        });
    }
</script>

</body>
</html>
